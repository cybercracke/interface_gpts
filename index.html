<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hugging Face Chat Interface</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue', sans-serif;
        }
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        .animate-bounce {
            animation: bounce 1s infinite;
        }
        .animate-bounce:nth-child(2) {
            animation-delay: 0.1s;
        }
        .animate-bounce:nth-child(3) {
            animation-delay: 0.2s;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="module">
        // Import Hugging Face Inference Client from CDN
        import { InferenceClient } from 'https://cdn.jsdelivr.net/npm/@huggingface/inference@4.11.3/+esm';

        // ============================================
        // CREDENȚIALE CRIPTATE - COMPLETEAZĂ CU STRINGUL TĂU
        // ============================================
        const ENCRYPTED_CREDENTIALS = "ENCRYPTED_DATA_HERE";

        // ============================================
        // FUNCȚII DE DECRIPTARE
        // ============================================
        async function deriveKey(password, salt) {
            const encoder = new TextEncoder();
            const keyMaterial = await crypto.subtle.importKey(
                'raw',
                encoder.encode(password),
                'PBKDF2',
                false,
                ['deriveBits', 'deriveKey']
            );
            
            return crypto.subtle.deriveKey(
                {
                    name: 'PBKDF2',
                    salt: salt,
                    iterations: 100000,
                    hash: 'SHA-256'
                },
                keyMaterial,
                { name: 'AES-GCM', length: 256 },
                false,
                ['encrypt', 'decrypt']
            );
        }

        async function decryptCredentials(encryptedBase64, password) {
            try {
                const combined = new Uint8Array(
                    atob(encryptedBase64).split('').map(c => c.charCodeAt(0))
                );
                
                const salt = combined.slice(0, 16);
                const iv = combined.slice(16, 28);
                const encryptedData = combined.slice(28);
                
                const key = await deriveKey(password, salt);
                
                const decryptedBuffer = await crypto.subtle.decrypt(
                    { name: 'AES-GCM', iv: iv },
                    key,
                    encryptedData
                );
                
                const decoder = new TextDecoder();
                const decryptedString = decoder.decode(decryptedBuffer);
                const credentials = JSON.parse(decryptedString);
                
                return credentials;
                
            } catch (error) {
                throw new Error('Decriptare eșuată: Parolă incorectă sau date corupte');
            }
        }

        // SVG Icons
        const icons = {
            messageSquare: `<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>`,
            settings: `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M12 1v6m0 6v6m9-9h-6m-6 0H3m15.364 6.364l-4.243-4.243m-6.364 0L3.636 9.636m12.728 12.728l-4.243-4.243m-6.364 0L3.636 14.364"></path></svg>`,
            send: `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>`,
            trash: `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></svg>`,
            lock: `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>`
        };

        class ChatApp {
            constructor() {
                this.messages = [];
                this.apiKey = '';
                this.modelName = '';
                this.maxTokens = 4096;
                this.loading = false;
                this.showSettings = false; // Collapsed by default după autentificare
                this.isAuthenticated = false;
                this.client = null;
                
                this.render();
                this.attachEventListeners();
            }

            async authenticate(password) {
                try {
                    // Încearcă să decriptezi credențialele
                    const credentials = await decryptCredentials(ENCRYPTED_CREDENTIALS, password);
                    
                    // Setează credențialele decriptate
                    this.apiKey = credentials.key;
                    this.modelName = credentials.model;
                    this.isAuthenticated = true;
                    
                    // Adaugă mesaj de succes în chat
                    this.messages.push({
                        role: 'assistant',
                        content: '✅ Decriptare reușită! Conexiune stabilită cu succes.\n\nTestez conexiunea...'
                    });
                    
                    this.render();
                    this.scrollToBottom();
                    
                    // Trimite mesaj de test automat
                    await this.sendTestMessage();
                    
                } catch (error) {
                    // Adaugă mesaj de eroare în chat
                    this.messages.push({
                        role: 'assistant',
                        content: '❌ Eroare de autentificare: Parolă incorectă!\n\nTe rog încearcă din nou.'
                    });
                    this.render();
                    this.scrollToBottom();
                }
            }

            async sendTestMessage() {
                this.loading = true;
                this.render();

                try {
                    this.client = new InferenceClient(this.apiKey);
                    
                    const chatCompletion = await this.client.chatCompletion({
                        provider: "auto",
                        model: this.modelName,
                        messages: [{ role: 'user', content: 'Hello GPT' }],
                        max_tokens: this.maxTokens,
                    });

                    this.messages.push({
                        role: 'assistant',
                        content: chatCompletion.choices[0].message.content
                    });
                } catch (error) {
                    this.messages.push({
                        role: 'assistant',
                        content: `❌ Eroare la testarea conexiunii: ${error.message}`
                    });
                } finally {
                    this.loading = false;
                    this.render();
                    this.scrollToBottom();
                }
            }

            async sendMessage() {
                const input = document.getElementById('message-input');
                const messageText = input.value.trim();
                
                if (!messageText || !this.isAuthenticated) return;

                const userMessage = { role: 'user', content: messageText };
                this.messages.push(userMessage);
                input.value = '';
                this.loading = true;
                this.render();

                try {
                    this.client = new InferenceClient(this.apiKey);
                    
                    const chatCompletion = await this.client.chatCompletion({
                        provider: "auto",
                        model: this.modelName,
                        messages: this.messages.filter(m => m.role === 'user' || m.role === 'assistant'),
                        max_tokens: this.maxTokens,
                    });

                    const assistantMessage = {
                        role: 'assistant',
                        content: chatCompletion.choices[0].message.content,
                    };

                    this.messages.push(assistantMessage);
                } catch (error) {
                    this.messages.push({
                        role: 'assistant',
                        content: `❌ Eroare: ${error.message}`,
                    });
                } finally {
                    this.loading = false;
                    this.render();
                    this.scrollToBottom();
                }
            }

            clearChat() {
                this.messages = [];
                this.render();
            }

            toggleSettings() {
                this.showSettings = !this.showSettings;
                this.render();
            }

            scrollToBottom() {
                setTimeout(() => {
                    const chatContainer = document.getElementById('chat-container');
                    if (chatContainer) {
                        chatContainer.scrollTop = chatContainer.scrollHeight;
                    }
                }, 100);
            }

            escapeHtml(text) {
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }

            attachEventListeners() {
                document.addEventListener('click', (e) => {
                    if (e.target.closest('#auth-btn')) {
                        e.preventDefault();
                        const passwordInput = document.getElementById('auth-password');
                        if (passwordInput && passwordInput.value) {
                            this.authenticate(passwordInput.value);
                        }
                    }
                    if (e.target.closest('#send-btn')) {
                        e.preventDefault();
                        this.sendMessage();
                    }
                    if (e.target.closest('#clear-btn')) {
                        e.preventDefault();
                        this.clearChat();
                    }
                    if (e.target.closest('#settings-btn')) {
                        e.preventDefault();
                        this.toggleSettings();
                    }
                });

                document.addEventListener('keypress', (e) => {
                    if (e.target.id === 'auth-password' && e.key === 'Enter') {
                        e.preventDefault();
                        const passwordInput = document.getElementById('auth-password');
                        if (passwordInput && passwordInput.value) {
                            this.authenticate(passwordInput.value);
                        }
                    }
                    if (e.target.id === 'message-input' && e.key === 'Enter' && !e.shiftKey) {
                        e.preventDefault();
                        this.sendMessage();
                    }
                });

                document.addEventListener('input', (e) => {
                    if (e.target.id === 'max-tokens') this.maxTokens = parseInt(e.target.value) || 4096;
                });
            }

            renderAuthScreen() {
                return `
                    <div class="min-h-screen bg-gradient-to-br from-slate-900 via-purple-900 to-slate-900 flex items-center justify-center p-4">
                        <div class="w-full max-w-md bg-slate-800 rounded-2xl shadow-2xl overflow-hidden">
                            
                            <!-- Auth Header -->
                            <div class="bg-gradient-to-r from-purple-600 to-blue-600 p-6 text-center">
                                <div class="flex justify-center mb-4">
                                    <div class="text-white">${icons.lock}</div>
                                </div>
                                <h1 class="text-2xl font-bold text-white mb-2">Autentificare Securizată</h1>
                                <p class="text-purple-100 text-sm">Introdu parola pentru a accesa chat-ul</p>
                            </div>

                            <!-- Auth Form -->
                            <div class="p-6 space-y-4">
                                <div>
                                    <label class="block text-sm font-medium text-gray-200 mb-2">
                                        Parolă de Decriptare
                                    </label>
                                    <input
                                        id="auth-password"
                                        type="password"
                                        placeholder="Introdu parola..."
                                        class="w-full px-4 py-3 bg-slate-600 border border-slate-500 rounded-lg text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-purple-500"
                                    />
                                </div>

                                <button
                                    id="auth-btn"
                                    class="w-full px-6 py-3 bg-gradient-to-r from-purple-600 to-blue-600 text-white font-semibold rounded-lg hover:from-purple-700 hover:to-blue-700 transition-all"
                                >
                                    🔓 Conectează
                                </button>

                                <div class="bg-amber-900/30 border border-amber-600/50 rounded-lg p-3">
                                    <p class="text-xs text-amber-200">
                                        🔒 Credențialele sunt criptate cu AES-256-GCM pentru securitate maximă.
                                    </p>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            }

            renderChatScreen() {
                return `
                    <div class="min-h-screen bg-gradient-to-br from-slate-900 via-purple-900 to-slate-900 flex items-center justify-center p-4">
                        <div class="w-full max-w-4xl bg-slate-800 rounded-2xl shadow-2xl overflow-hidden">
                            
                            <!-- Header -->
                            <div class="bg-gradient-to-r from-purple-600 to-blue-600 p-4 flex items-center justify-between">
                                <div class="flex items-center gap-3">
                                    <div class="text-white">${icons.messageSquare}</div>
                                    <div>
                                        <h1 class="text-xl font-bold text-white">Hugging Face Chat</h1>
                                        <p class="text-purple-100 text-sm">${this.escapeHtml(this.modelName)}</p>
                                    </div>
                                </div>
                                <div class="flex gap-2">
                                    ${this.messages.length > 0 ? `
                                        <button id="clear-btn" class="p-2 hover:bg-white/20 rounded-lg transition-colors text-white" title="Șterge conversația">
                                            ${icons.trash}
                                        </button>
                                    ` : ''}
                                    <button id="settings-btn" class="p-2 hover:bg-white/20 rounded-lg transition-colors text-white" title="Setări">
                                        ${icons.settings}
                                    </button>
                                </div>
                            </div>

                            <!-- Settings Panel -->
                            ${this.showSettings ? `
                                <div class="bg-slate-700 p-4 border-b border-slate-600">
                                    <div class="space-y-4">
                                        <div>
                                            <label class="block text-sm font-medium text-gray-200 mb-2">
                                                Hugging Face API Token
                                            </label>
                                            <input
                                                type="password"
                                                value="${this.escapeHtml(this.apiKey)}"
                                                disabled
                                                class="w-full px-4 py-2 bg-slate-600 border border-slate-500 rounded-lg text-white placeholder-gray-400 opacity-75 cursor-not-allowed"
                                            />
                                            <p class="text-xs text-gray-400 mt-2">
                                                ✅ Token decriptat și configurat
                                            </p>
                                        </div>
                                        
                                        <div>
                                            <label class="block text-sm font-medium text-gray-200 mb-2">
                                                Numele Complet al Modelului
                                            </label>
                                            <input
                                                type="text"
                                                value="${this.escapeHtml(this.modelName)}"
                                                disabled
                                                class="w-full px-4 py-2 bg-slate-600 border border-slate-500 rounded-lg text-white placeholder-gray-400 opacity-75 cursor-not-allowed"
                                            />
                                            <p class="text-xs text-gray-400 mt-2">
                                                ✅ Model decriptat și configurat
                                            </p>
                                        </div>

                                        <div>
                                            <label class="block text-sm font-medium text-gray-200 mb-2">
                                                Max Tokens (Răspuns)
                                            </label>
                                            <input
                                                id="max-tokens"
                                                type="number"
                                                value="${this.maxTokens}"
                                                min="1"
                                                max="4096"
                                                class="w-full px-4 py-2 bg-slate-600 border border-slate-500 rounded-lg text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-purple-500"
                                            />
                                            <p class="text-xs text-gray-400 mt-2">
                                                Limita maximă: 4096 tokens
                                            </p>
                                        </div>

                                        <div class="bg-green-900/30 border border-green-600/50 rounded-lg p-3">
                                            <p class="text-sm text-green-200">
                                                🔒 Autentificat cu succes • Provider: auto
                                            </p>
                                        </div>
                                    </div>
                                </div>
                            ` : ''}

                            <!-- Chat Messages -->
                            <div class="h-96 overflow-y-auto p-4 space-y-4 bg-slate-800" id="chat-container">
                                ${this.messages.length === 0 ? `
                                    <div class="text-center text-gray-400 mt-20">
                                        <div class="mx-auto mb-4 opacity-50 flex justify-center">${icons.messageSquare}</div>
                                        <p class="text-lg mb-2">Chat activ cu ${this.escapeHtml(this.modelName)}</p>
                                        <p class="text-sm">Scrie un mesaj pentru a începe conversația...</p>
                                    </div>
                                ` : this.messages.map((msg, idx) => `
                                    <div class="flex ${msg.role === 'user' ? 'justify-end' : 'justify-start'}">
                                        <div class="max-w-3/4 px-4 py-3 rounded-2xl ${
                                            msg.role === 'user'
                                                ? 'bg-gradient-to-r from-purple-600 to-blue-600 text-white'
                                                : 'bg-slate-700 text-gray-100'
                                        }">
                                            <p class="whitespace-pre-wrap">${this.escapeHtml(msg.content)}</p>
                                        </div>
                                    </div>
                                `).join('')}
                                ${this.loading ? `
                                    <div class="flex justify-start">
                                        <div class="bg-slate-700 text-gray-100 px-4 py-3 rounded-2xl">
                                            <div class="flex gap-2">
                                                <div class="w-2 h-2 bg-purple-500 rounded-full animate-bounce"></div>
                                                <div class="w-2 h-2 bg-purple-500 rounded-full animate-bounce"></div>
                                                <div class="w-2 h-2 bg-purple-500 rounded-full animate-bounce"></div>
                                            </div>
                                        </div>
                                    </div>
                                ` : ''}
                            </div>

                            <!-- Input Area -->
                            <div class="bg-slate-700 p-4 border-t border-slate-600">
                                <div class="flex gap-2">
                                    <textarea
                                        id="message-input"
                                        placeholder="Scrie un mesaj..."
                                        ${this.loading ? 'disabled' : ''}
                                        class="flex-1 px-4 py-3 bg-slate-600 border border-slate-500 rounded-lg text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-purple-500 resize-none disabled:opacity-50 disabled:cursor-not-allowed"
                                        rows="2"
                                    ></textarea>
                                    <button
                                        id="send-btn"
                                        ${this.loading ? 'disabled' : ''}
                                        class="px-6 py-3 bg-gradient-to-r from-purple-600 to-blue-600 text-white rounded-lg hover:from-purple-700 hover:to-blue-700 disabled:opacity-50 disabled:cursor-not-allowed transition-all flex items-center justify-center"
                                    >
                                        ${icons.send}
                                    </button>
                                </div>
                                <p class="text-xs text-gray-400 mt-2 text-center">
                                    Apasă Enter pentru a trimite • Shift+Enter pentru linie nouă
                                </p>
                            </div>
                        </div>
                    </div>
                `;
            }

            render() {
                const root = document.getElementById('root');
                if (!this.isAuthenticated) {
                    root.innerHTML = this.renderAuthScreen();
                } else {
                    root.innerHTML = this.renderChatScreen();
                }
            }
        }

        // Initialize app
        new ChatApp();
    </script>
</body>
</html>
