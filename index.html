<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DarkGPT - AI Chat Interface</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue', sans-serif;
            overflow: hidden;
        }
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        .animate-bounce {
            animation: bounce 1s infinite;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        .fade-in {
            animation: fadeIn 0.3s ease-in;
        }
        .chat-item:hover .delete-btn {
            opacity: 1;
        }
        .delete-btn {
            opacity: 0;
            transition: opacity 0.2s;
        }
        .message-content:hover .copy-btn {
            opacity: 1;
        }
        .copy-btn {
            opacity: 0;
            transition: opacity 0.2s;
        }
        
        /* Mobile optimizations */
        @media (max-width: 768px) {
            body {
                font-size: 14px;
            }
            .mobile-compact {
                padding: 0.5rem !important;
            }
            .mobile-text-sm {
                font-size: 0.875rem !important;
            }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="module">
        import { InferenceClient } from 'https://cdn.jsdelivr.net/npm/@huggingface/inference@4.11.3/+esm';

        const ENCRYPTED_CREDENTIALS = "4H+tcsqndX+3drzTgd1qIh6UHCIObsdmKQRTvUlhrK0EGwvMJq6uAzmcOdPvMkjAPlDJNhGFHX+0AufRwsN73Gdvp2d0m80yA0nk0C0LugnbnrYmQiqFcEjdllu9rxx6vqsTejMhEUfFqYfD94lnr8wam4BIIdLurixjHPiD5SnbAgVLoXvGviP8KIEK";

        // ============================================
        // FUNCȚII DE DECRIPTARE
        // ============================================
        async function deriveKey(password, salt) {
            const encoder = new TextEncoder();
            const keyMaterial = await crypto.subtle.importKey(
                'raw',
                encoder.encode(password),
                'PBKDF2',
                false,
                ['deriveBits', 'deriveKey']
            );
            
            return crypto.subtle.deriveKey(
                {
                    name: 'PBKDF2',
                    salt: salt,
                    iterations: 100000,
                    hash: 'SHA-256'
                },
                keyMaterial,
                { name: 'AES-GCM', length: 256 },
                false,
                ['encrypt', 'decrypt']
            );
        }

        async function decryptCredentials(encryptedBase64, password) {
            try {
                const combined = new Uint8Array(
                    atob(encryptedBase64).split('').map(c => c.charCodeAt(0))
                );
                
                const salt = combined.slice(0, 16);
                const iv = combined.slice(16, 28);
                const encryptedData = combined.slice(28);
                
                const key = await deriveKey(password, salt);
                
                const decryptedBuffer = await crypto.subtle.decrypt(
                    { name: 'AES-GCM', iv: iv },
                    key,
                    encryptedData
                );
                
                const decoder = new TextDecoder();
                const decryptedString = decoder.decode(decryptedBuffer);
                const credentials = JSON.parse(decryptedString);
                
                return credentials;
                
            } catch (error) {
                throw new Error('Decriptare eșuată: Parolă incorectă sau date corupte');
            }
        }

        // SVG Icons
        const icons = {
            menu: `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>`,
            plus: `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>`,
            settings: `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"></circle><path d="M12 1v6m0 6v6m9-9h-6m-6 0H3m15.364 6.364l-4.243-4.243m-6.364 0L3.636 9.636m12.728 12.728l-4.243-4.243m-6.364 0L3.636 14.364"></path></svg>`,
            send: `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>`,
            trash: `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>`,
            copy: `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>`,
            lock: `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>`,
            chat: `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>`,
            close: `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>`
        };

        class ChatApp {
            constructor() {
                this.chats = this.loadChats();
                this.currentChatId = this.chats.length > 0 ? this.chats[0].id : null;
                this.apiKey = '';
                this.modelName = '';
                this.maxTokens = 4096;
                this.loading = false;
                this.isAuthenticated = false;
                this.sidebarOpen = window.innerWidth >= 768; // Închis pe mobil by default
                this.showSettings = false;
                this.client = null;
                this.copiedMessageId = null;
                
                this.render();
                this.attachEventListeners();
            }

            // ============================================
            // CHAT MANAGEMENT
            // ============================================
            loadChats() {
                const saved = localStorage.getItem('darkgpt_chats');
                return saved ? JSON.parse(saved) : [];
            }

            saveChats() {
                localStorage.setItem('darkgpt_chats', JSON.stringify(this.chats));
            }

            getCurrentChat() {
                return this.chats.find(c => c.id === this.currentChatId);
            }

            createNewChat() {
                const newChat = {
                    id: Date.now().toString(),
                    title: 'New Chat',
                    messages: [],
                    createdAt: new Date().toISOString()
                };
                this.chats.unshift(newChat);
                this.currentChatId = newChat.id;
                this.saveChats();
                this.render();
            }

            deleteChat(chatId, event) {
                event.stopPropagation();
                if (confirm('Ești sigur că vrei să ștergi această conversație?')) {
                    this.chats = this.chats.filter(c => c.id !== chatId);
                    if (this.currentChatId === chatId) {
                        this.currentChatId = this.chats.length > 0 ? this.chats[0].id : null;
                    }
                    this.saveChats();
                    this.render();
                }
            }

            deleteCurrentChat() {
                if (!this.currentChatId) return;
                if (confirm('Ești sigur că vrei să ștergi conversația curentă?')) {
                    this.deleteChat(this.currentChatId, { stopPropagation: () => {} });
                }
            }

            switchChat(chatId) {
                this.currentChatId = chatId;
                // Pe mobile, închide sidebar-ul după selectarea chat-ului
                if (window.innerWidth < 768) {
                    this.sidebarOpen = false;
                }
                this.render();
                this.scrollToBottom();
            }

            updateChatTitle(chatId) {
                const chat = this.chats.find(c => c.id === chatId);
                if (chat && chat.messages.length > 0) {
                    const firstUserMsg = chat.messages.find(m => m.role === 'user');
                    if (firstUserMsg) {
                        chat.title = firstUserMsg.content.substring(0, 30) + (firstUserMsg.content.length > 30 ? '...' : '');
                        this.saveChats();
                    }
                }
            }

            // ============================================
            // AUTHENTICATION
            // ============================================
            async authenticate(password) {
                try {
                    const credentials = await decryptCredentials(ENCRYPTED_CREDENTIALS, password);
                    
                    this.apiKey = credentials.key;
                    this.modelName = credentials.model;
                    this.isAuthenticated = true;
                    
                    if (this.chats.length === 0) {
                        this.createNewChat();
                    }
                    
                    const currentChat = this.getCurrentChat();
                    currentChat.messages.push({
                        id: Date.now().toString(),
                        role: 'assistant',
                        content: '✅ Decriptare reușită! Conexiune stabilită cu succes.\n\nTestez conexiunea...'
                    });
                    
                    this.render();
                    this.scrollToBottom();
                    
                    await this.sendTestMessage();
                    
                } catch (error) {
                    alert('❌ Eroare de autentificare: Parolă incorectă!');
                }
            }

            async sendTestMessage() {
                this.loading = true;
                this.render();

                try {
                    this.client = new InferenceClient(this.apiKey);
                    
                    const chatCompletion = await this.client.chatCompletion({
                        provider: "auto",
                        model: this.modelName,
                        messages: [{ role: 'user', content: 'Salut! Vreau să vorbim în limba română.' }],
                        max_tokens: this.maxTokens,
                    });

                    const currentChat = this.getCurrentChat();
                    currentChat.messages.push({
                        id: Date.now().toString(),
                        role: 'assistant',
                        content: chatCompletion.choices[0].message.content
                    });
                    this.saveChats();
                } catch (error) {
                    const currentChat = this.getCurrentChat();
                    currentChat.messages.push({
                        id: Date.now().toString(),
                        role: 'assistant',
                        content: `❌ Eroare la testarea conexiunii: ${error.message}`
                    });
                } finally {
                    this.loading = false;
                    this.render();
                    this.scrollToBottom();
                }
            }

            // ============================================
            // MESSAGING
            // ============================================
            async sendMessage(messageText) {
                if (!messageText.trim() || !this.isAuthenticated) return;

                const currentChat = this.getCurrentChat();
                if (!currentChat) {
                    this.createNewChat();
                }

                const userMessage = { 
                    id: Date.now().toString(),
                    role: 'user', 
                    content: messageText 
                };
                currentChat.messages.push(userMessage);
                
                if (currentChat.messages.filter(m => m.role === 'user').length === 1) {
                    this.updateChatTitle(currentChat.id);
                }
                
                this.loading = true;
                this.saveChats();
                this.render();
                this.scrollToBottom();

                try {
                    this.client = new InferenceClient(this.apiKey);
                    
                    const chatMessages = currentChat.messages
                        .filter(m => m.role === 'user' || m.role === 'assistant')
                        .map(m => ({ role: m.role, content: m.content }));
                    
                    const chatCompletion = await this.client.chatCompletion({
                        provider: "auto",
                        model: this.modelName,
                        messages: chatMessages,
                        max_tokens: this.maxTokens,
                    });

                    const assistantMessage = {
                        id: Date.now().toString(),
                        role: 'assistant',
                        content: chatCompletion.choices[0].message.content,
                    };

                    currentChat.messages.push(assistantMessage);
                    this.saveChats();
                } catch (error) {
                    currentChat.messages.push({
                        id: Date.now().toString(),
                        role: 'assistant',
                        content: `❌ Eroare: ${error.message}`,
                    });
                } finally {
                    this.loading = false;
                    this.render();
                    this.scrollToBottom();
                }
            }

            async copyMessage(messageId, content) {
                try {
                    await navigator.clipboard.writeText(content);
                    this.copiedMessageId = messageId;
                    this.render();
                    setTimeout(() => {
                        this.copiedMessageId = null;
                        this.render();
                    }, 2000);
                } catch (error) {
                    console.error('Failed to copy:', error);
                }
            }

            // ============================================
            // UI HELPERS
            // ============================================
            toggleSidebar() {
                this.sidebarOpen = !this.sidebarOpen;
                this.render();
            }

            toggleSettings() {
                this.showSettings = !this.showSettings;
                this.render();
            }

            scrollToBottom() {
                setTimeout(() => {
                    const chatContainer = document.getElementById('chat-messages');
                    if (chatContainer) {
                        chatContainer.scrollTop = chatContainer.scrollHeight;
                    }
                }, 100);
            }

            escapeHtml(text) {
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }

            // ============================================
            // EVENT LISTENERS
            // ============================================
            attachEventListeners() {
                document.addEventListener('click', (e) => {
                    // Close sidebar on overlay click (mobile)
                    if (e.target.id === 'sidebar-overlay') {
                        this.sidebarOpen = false;
                        this.render();
                    }
                    
                    // Auth
                    if (e.target.closest('#auth-btn')) {
                        e.preventDefault();
                        const passwordInput = document.getElementById('auth-password');
                        if (passwordInput?.value) {
                            this.authenticate(passwordInput.value);
                        }
                    }
                    
                    // Sidebar
                    if (e.target.closest('#toggle-sidebar')) {
                        this.toggleSidebar();
                    }
                    if (e.target.closest('#new-chat-btn')) {
                        this.createNewChat();
                    }
                    if (e.target.closest('#settings-btn')) {
                        this.toggleSettings();
                    }
                    
                    // Chat switching
                    const chatItem = e.target.closest('.chat-item');
                    if (chatItem && !e.target.closest('.delete-chat-btn')) {
                        this.switchChat(chatItem.dataset.chatId);
                    }
                    
                    // Delete chat
                    const deleteBtn = e.target.closest('.delete-chat-btn');
                    if (deleteBtn) {
                        this.deleteChat(deleteBtn.dataset.chatId, e);
                    }
                    if (e.target.closest('#delete-current-chat')) {
                        this.deleteCurrentChat();
                    }
                    
                    // Send message
                    if (e.target.closest('#send-btn')) {
                        const input = document.getElementById('message-input');
                        if (input?.value.trim()) {
                            this.sendMessage(input.value);
                            input.value = '';
                        }
                    }
                    
                    // Copy message
                    const copyBtn = e.target.closest('.copy-btn');
                    if (copyBtn) {
                        this.copyMessage(copyBtn.dataset.messageId, copyBtn.dataset.content);
                    }
                    
                    // Close settings
                    if (e.target.id === 'settings-overlay' || e.target.closest('#close-settings')) {
                        this.showSettings = false;
                        this.render();
                    }
                });

                document.addEventListener('keypress', (e) => {
                    if (e.target.id === 'auth-password' && e.key === 'Enter') {
                        e.preventDefault();
                        const passwordInput = document.getElementById('auth-password');
                        if (passwordInput?.value) {
                            this.authenticate(passwordInput.value);
                        }
                    }
                    if (e.target.id === 'message-input' && e.key === 'Enter' && !e.shiftKey) {
                        e.preventDefault();
                        const input = document.getElementById('message-input');
                        if (input?.value.trim()) {
                            this.sendMessage(input.value);
                            input.value = '';
                        }
                    }
                });

                document.addEventListener('input', (e) => {
                    if (e.target.id === 'max-tokens') {
                        this.maxTokens = parseInt(e.target.value) || 4096;
                    }
                    // Auto-resize textarea
                    if (e.target.id === 'message-input') {
                        e.target.style.height = 'auto';
                        e.target.style.height = Math.min(e.target.scrollHeight, 120) + 'px';
                    }
                });
            }

            // ============================================
            // RENDER METHODS
            // ============================================
            renderAuthScreen() {
                return `
                    <div class="fixed inset-0 bg-gradient-to-br from-slate-900 via-purple-900 to-slate-900 flex items-center justify-center p-3 md:p-4">
                        <div class="w-full max-w-md bg-slate-800 rounded-xl md:rounded-2xl shadow-2xl overflow-hidden">
                            <div class="bg-gradient-to-r from-purple-600 to-blue-600 p-4 md:p-6 text-center">
                                <div class="flex justify-center mb-3 md:mb-4">
                                    <div class="text-white">${icons.lock}</div>
                                </div>
                                <h1 class="text-xl md:text-2xl font-bold text-white mb-1 md:mb-2">DarkGPT</h1>
                                <p class="text-sm md:text-base text-purple-100">Autentificare Securizată</p>
                            </div>
                            <div class="p-4 md:p-6 space-y-3 md:space-y-4">
                                <div>
                                    <label class="block text-xs md:text-sm font-medium text-gray-200 mb-2">
                                        Parolă de Decriptare
                                    </label>
                                    <input
                                        id="auth-password"
                                        type="password"
                                        placeholder="Introdu parola..."
                                        class="w-full px-3 md:px-4 py-2 md:py-3 text-sm md:text-base bg-slate-600 border border-slate-500 rounded-lg text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-purple-500"
                                    />
                                </div>
                                <button
                                    id="auth-btn"
                                    class="w-full px-4 md:px-6 py-2.5 md:py-3 text-sm md:text-base bg-gradient-to-r from-purple-600 to-blue-600 text-white font-semibold rounded-lg hover:from-purple-700 hover:to-blue-700 transition-all"
                                >
                                    🔓 Conectează
                                </button>
                                <div class="bg-amber-900/30 border border-amber-600/50 rounded-lg p-2.5 md:p-3">
                                    <p class="text-xs text-amber-200">
                                        🔒 Criptare AES-256-GCM
                                    </p>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            }

            renderSidebar() {
                if (!this.sidebarOpen) return '';
                
                return `
                    <div class="fixed left-0 top-0 md:relative z-30 w-60 sm:w-64 h-full bg-slate-900 border-r border-slate-700 flex flex-col transition-all duration-300">
                        <!-- Sidebar Header -->
                        <div class="p-3 md:p-4 border-b border-slate-700">
                            <button id="new-chat-btn" class="w-full flex items-center justify-center gap-2 px-3 md:px-4 py-2 md:py-2.5 text-sm md:text-base bg-gradient-to-r from-purple-600 to-blue-600 text-white rounded-lg hover:from-purple-700 hover:to-blue-700 transition-all font-medium">
                                ${icons.plus}
                                <span>New Chat</span>
                            </button>
                        </div>
                        
                        <!-- Chat List -->
                        <div class="flex-1 overflow-y-auto p-2">
                            ${this.chats.map(chat => `
                                <div class="chat-item relative group mb-1 cursor-pointer" data-chat-id="${chat.id}">
                                    <div class="flex items-center gap-2 px-2 md:px-3 py-2 md:py-2.5 rounded-lg hover:bg-slate-800 ${this.currentChatId === chat.id ? 'bg-slate-800' : ''} transition-colors">
                                        <div class="text-gray-400 flex-shrink-0">${icons.chat}</div>
                                        <div class="flex-1 text-xs md:text-sm text-gray-300 truncate">${this.escapeHtml(chat.title)}</div>
                                        <button class="delete-chat-btn delete-btn p-1 hover:bg-red-600/20 rounded text-red-400 hover:text-red-300 flex-shrink-0" data-chat-id="${chat.id}">
                                            ${icons.trash}
                                        </button>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                        
                        <!-- Sidebar Footer -->
                        <div class="p-2 md:p-4 border-t border-slate-700 space-y-1 md:space-y-2">
                            <button id="toggle-sidebar" class="w-full flex items-center gap-2 px-2 md:px-4 py-2 md:py-2.5 text-xs md:text-base text-gray-300 hover:bg-slate-800 rounded-lg transition-colors">
                                ${icons.close}
                                <span class="hidden sm:inline">Ascunde</span>
                            </button>
                            <button id="settings-btn" class="w-full flex items-center gap-2 px-2 md:px-4 py-2 md:py-2.5 text-xs md:text-base text-gray-300 hover:bg-slate-800 rounded-lg transition-colors">
                                ${icons.settings}
                                <span>Setări</span>
                            </button>
                        </div>
                    </div>
                `;
            }

            renderSettings() {
                if (!this.showSettings) return '';
                
                return `
                    <div id="settings-overlay" class="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-3 md:p-4 fade-in">
                        <div class="bg-slate-800 rounded-xl shadow-2xl w-full max-w-md max-h-[90vh] overflow-y-auto">
                            <div class="sticky top-0 bg-gradient-to-r from-purple-600 to-blue-600 p-3 md:p-4 flex items-center justify-between">
                                <h2 class="text-lg md:text-xl font-bold text-white">⚙️ Setări</h2>
                                <button id="close-settings" class="text-white hover:bg-white/20 p-1 rounded">
                                    ${icons.close}
                                </button>
                            </div>
                            <div class="p-4 md:p-6 space-y-3 md:space-y-4">
                                <div>
                                    <label class="block text-xs md:text-sm font-medium text-gray-200 mb-2">API Token</label>
                                    <input type="password" value="${this.escapeHtml(this.apiKey)}" disabled class="w-full px-3 md:px-4 py-2 text-sm md:text-base bg-slate-700 border border-slate-600 rounded-lg text-white opacity-75 cursor-not-allowed" />
                                    <p class="text-xs text-gray-400 mt-2">✅ Token decriptat</p>
                                </div>
                                <div>
                                    <label class="block text-xs md:text-sm font-medium text-gray-200 mb-2">Model</label>
                                    <input type="text" value="${this.escapeHtml(this.modelName)}" disabled class="w-full px-3 md:px-4 py-2 text-sm md:text-base bg-slate-700 border border-slate-600 rounded-lg text-white opacity-75 cursor-not-allowed" />
                                    <p class="text-xs text-gray-400 mt-2">✅ Model decriptat</p>
                                </div>
                                <div>
                                    <label class="block text-xs md:text-sm font-medium text-gray-200 mb-2">Max Tokens</label>
                                    <input id="max-tokens" type="number" value="${this.maxTokens}" min="1" max="4096" class="w-full px-3 md:px-4 py-2 text-sm md:text-base bg-slate-700 border border-slate-600 rounded-lg text-white focus:outline-none focus:ring-2 focus:ring-purple-500" />
                                    <p class="text-xs text-gray-400 mt-2">Limită: 1-4096 tokens</p>
                                </div>
                                <div class="bg-green-900/30 border border-green-600/50 rounded-lg p-2.5 md:p-3">
                                    <p class="text-xs md:text-sm text-green-200">🔒 Autentificat • Provider: auto</p>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            }

            renderChatScreen() {
                const currentChat = this.getCurrentChat();
                const messages = currentChat?.messages || [];
                
                return `
                    <div class="fixed inset-0 flex bg-slate-900">
                        <!-- Mobile Overlay -->
                        ${this.sidebarOpen ? `<div class="md:hidden fixed inset-0 bg-black/50 z-20" id="sidebar-overlay"></div>` : ''}
                        
                        ${this.renderSidebar()}
                        
                        <!-- Main Chat Area -->
                        <div class="flex-1 flex flex-col">
                            <!-- Header -->
                            <div class="bg-slate-800 border-b border-slate-700 px-2 md:px-4 py-2 md:py-3 flex items-center justify-between">
                                <div class="flex items-center gap-2 md:gap-3">
                                    ${!this.sidebarOpen ? `
                                        <button id="toggle-sidebar" class="text-gray-400 hover:text-white p-1 hover:bg-slate-700 rounded transition-colors">
                                            ${icons.menu}
                                        </button>
                                    ` : ''}
                                    <h1 class="text-base md:text-lg font-bold text-white">DarkGPT</h1>
                                    <span class="hidden sm:inline text-xs md:text-sm text-gray-400">${this.escapeHtml(this.modelName)}</span>
                                </div>
                                ${currentChat ? `
                                    <button id="delete-current-chat" class="text-red-400 hover:text-red-300 hover:bg-red-600/20 p-1.5 md:p-2 rounded transition-colors" title="Șterge conversația">
                                        ${icons.trash}
                                    </button>
                                ` : ''}
                            </div>
                            
                            <!-- Messages -->
                            <div id="chat-messages" class="flex-1 overflow-y-auto p-2 md:p-4 space-y-3 md:space-y-4">
                                ${messages.length === 0 ? `
                                    <div class="flex items-center justify-center h-full">
                                        <div class="text-center text-gray-400 px-4">
                                            <div class="text-4xl md:text-6xl mb-2 md:mb-4">💬</div>
                                            <p class="text-lg md:text-xl mb-1 md:mb-2">Începe o conversație</p>
                                            <p class="text-xs md:text-sm">Scrie un mesaj pentru a începe...</p>
                                        </div>
                                    </div>
                                ` : messages.map(msg => `
                                    <div class="flex ${msg.role === 'user' ? 'justify-end' : 'justify-start'}">
                                        <div class="message-content max-w-[85%] md:max-w-3xl ${msg.role === 'user' ? 'bg-gradient-to-r from-purple-600 to-blue-600 text-white' : 'bg-slate-800 text-gray-100'} rounded-xl md:rounded-2xl px-3 md:px-4 py-2 md:py-3 relative text-sm md:text-base">
                                            <p class="whitespace-pre-wrap break-words">${this.escapeHtml(msg.content)}</p>
                                            ${msg.role === 'assistant' ? `
                                                <button class="copy-btn absolute -bottom-7 md:-bottom-8 right-0 flex items-center gap-1 px-2 py-1 bg-slate-700 hover:bg-slate-600 rounded text-xs text-gray-300 transition-colors" data-message-id="${msg.id}" data-content="${this.escapeHtml(msg.content)}">
                                                    ${icons.copy}
                                                    <span class="hidden sm:inline">${this.copiedMessageId === msg.id ? '✓ Copiat!' : 'Copy'}</span>
                                                </button>
                                            ` : ''}
                                        </div>
                                    </div>
                                `).join('')}
                                ${this.loading ? `
                                    <div class="flex justify-start">
                                        <div class="bg-slate-800 rounded-xl md:rounded-2xl px-3 md:px-4 py-2 md:py-3">
                                            <div class="flex gap-2">
                                                <div class="w-2 h-2 bg-purple-500 rounded-full animate-bounce"></div>
                                                <div class="w-2 h-2 bg-purple-500 rounded-full animate-bounce" style="animation-delay: 0.1s"></div>
                                                <div class="w-2 h-2 bg-purple-500 rounded-full animate-bounce" style="animation-delay: 0.2s"></div>
                                            </div>
                                        </div>
                                    </div>
                                ` : ''}
                            </div>
                            
                            <!-- Input Area -->
                            <div class="bg-slate-800 border-t border-slate-700 p-2 md:p-4">
                                <div class="max-w-4xl mx-auto flex gap-1.5 md:gap-2">
                                    <textarea
                                        id="message-input"
                                        placeholder="Mesaj..."
                                        ${this.loading ? 'disabled' : ''}
                                        class="flex-1 px-2 md:px-4 py-2 md:py-3 bg-slate-700 border border-slate-600 rounded-lg md:rounded-xl text-sm md:text-base text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-purple-500 resize-none disabled:opacity-50"
                                        rows="1"
                                        style="max-height: 120px;"
                                    ></textarea>
                                    <button
                                        id="send-btn"
                                        ${this.loading ? 'disabled' : ''}
                                        class="px-3 md:px-4 py-2 md:py-3 bg-gradient-to-r from-purple-600 to-blue-600 text-white rounded-lg md:rounded-xl hover:from-purple-700 hover:to-blue-700 disabled:opacity-50 transition-all flex items-center justify-center"
                                    >
                                        ${icons.send}
                                    </button>
                                </div>
                            </div>
                        </div>
                        
                        ${this.renderSettings()}
                    </div>
                `;
            }

            render() {
                const root = document.getElementById('root');
                if (!this.isAuthenticated) {
                    root.innerHTML = this.renderAuthScreen();
                } else {
                    root.innerHTML = this.renderChatScreen();
                }
            }
        }

        new ChatApp();
    </script>
</body>
</html>
