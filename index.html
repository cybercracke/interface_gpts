<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hugging Face Chat Interface</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue', sans-serif;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        // Lucide Icons as inline SVG components
        const MessageSquare = ({ size = 24, className = "" }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
            </svg>
        );

        const Settings = ({ size = 24, className = "" }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <circle cx="12" cy="12" r="3"></circle>
                <path d="M12 1v6m0 6v6m9-9h-6m-6 0H3m15.364 6.364l-4.243-4.243m-6.364 0L3.636 9.636m12.728 12.728l-4.243-4.243m-6.364 0L3.636 14.364"></path>
            </svg>
        );

        const Send = ({ size = 24, className = "" }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <line x1="22" y1="2" x2="11" y2="13"></line>
                <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
            </svg>
        );

        const Trash2 = ({ size = 24, className = "" }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <polyline points="3 6 5 6 21 6"></polyline>
                <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                <line x1="10" y1="11" x2="10" y2="17"></line>
                <line x1="14" y1="11" x2="14" y2="17"></line>
            </svg>
        );

        function HuggingFaceChat() {
            const [messages, setMessages] = useState([]);
            const [input, setInput] = useState('');
            const [apiKey, setApiKey] = useState('');
            const [modelName, setModelName] = useState('darkc0de/Xortron');
            const [maxTokens, setMaxTokens] = useState(4096);
            const [loading, setLoading] = useState(false);
            const [showSettings, setShowSettings] = useState(true);

            const sendMessage = async () => {
                if (!input.trim() || !apiKey) return;

                const userMessage = { role: 'user', content: input };
                const updatedMessages = [...messages, userMessage];
                setMessages(updatedMessages);
                setInput('');
                setLoading(true);

                try {
                    const response = await fetch('https://router.huggingface.co/v1/chat/completions', {
                        method: 'POST',
                        headers: {
                            'Authorization': `Bearer ${apiKey}`,
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({
                            model: modelName,
                            messages: updatedMessages,
                            max_tokens: maxTokens,
                            stream: false,
                        }),
                    });

                    if (!response.ok) {
                        const errorData = await response.text();
                        throw new Error(`API Error ${response.status}: ${errorData}`);
                    }

                    const data = await response.json();
                    
                    if (!data.choices || !data.choices[0] || !data.choices[0].message) {
                        throw new Error('Răspuns invalid de la API');
                    }

                    const assistantMessage = {
                        role: 'assistant',
                        content: data.choices[0].message.content,
                    };

                    setMessages([...updatedMessages, assistantMessage]);
                } catch (error) {
                    console.error('Error:', error);
                    setMessages([
                        ...updatedMessages,
                        {
                            role: 'assistant',
                            content: `❌ Eroare: ${error.message}\n\nVerifică:\n- Token-ul HF este valid\n- Numele modelului este corect\n- Modelul suportă chat completions\n- Ai conexiune la internet`,
                        },
                    ]);
                } finally {
                    setLoading(false);
                }
            };

            const clearChat = () => {
                setMessages([]);
            };

            const handleKeyPress = (e) => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    sendMessage();
                }
            };

            return (
                <div className="min-h-screen bg-gradient-to-br from-slate-900 via-purple-900 to-slate-900 flex items-center justify-center p-4">
                    <div className="w-full max-w-4xl bg-slate-800 rounded-2xl shadow-2xl overflow-hidden">
                        {/* Header */}
                        <div className="bg-gradient-to-r from-purple-600 to-blue-600 p-4 flex items-center justify-between">
                            <div className="flex items-center gap-3">
                                <MessageSquare size={28} className="text-white" />
                                <div>
                                    <h1 className="text-xl font-bold text-white">Hugging Face Chat</h1>
                                    <p className="text-purple-100 text-sm">{modelName}</p>
                                </div>
                            </div>
                            <div className="flex gap-2">
                                {messages.length > 0 && (
                                    <button
                                        onClick={clearChat}
                                        className="p-2 hover:bg-white/20 rounded-lg transition-colors"
                                        title="Șterge conversația"
                                    >
                                        <Trash2 size={24} className="text-white" />
                                    </button>
                                )}
                                <button
                                    onClick={() => setShowSettings(!showSettings)}
                                    className="p-2 hover:bg-white/20 rounded-lg transition-colors"
                                    title="Setări"
                                >
                                    <Settings size={24} className="text-white" />
                                </button>
                            </div>
                        </div>

                        {/* Settings Panel */}
                        {showSettings && (
                            <div className="bg-slate-700 p-4 border-b border-slate-600">
                                <div className="space-y-4">
                                    <div>
                                        <label className="block text-sm font-medium text-gray-200 mb-2">
                                            Hugging Face API Token
                                        </label>
                                        <input
                                            type="password"
                                            value={apiKey}
                                            onChange={(e) => setApiKey(e.target.value)}
                                            placeholder="hf_..."
                                            className="w-full px-4 py-2 bg-slate-600 border border-slate-500 rounded-lg text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-purple-500"
                                        />
                                        <p className="text-xs text-gray-400 mt-2">
                                            Obține un token gratuit de la{' '}
                                            <a
                                                href="https://huggingface.co/settings/tokens"
                                                target="_blank"
                                                rel="noopener noreferrer"
                                                className="text-purple-400 hover:underline"
                                            >
                                                huggingface.co/settings/tokens
                                            </a>
                                        </p>
                                    </div>
                                    
                                    <div>
                                        <label className="block text-sm font-medium text-gray-200 mb-2">
                                            Numele Complet al Modelului
                                        </label>
                                        <input
                                            type="text"
                                            value={modelName}
                                            onChange={(e) => setModelName(e.target.value)}
                                            placeholder="username/model-name"
                                            className="w-full px-4 py-2 bg-slate-600 border border-slate-500 rounded-lg text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-purple-500"
                                        />
                                        <p className="text-xs text-gray-400 mt-2">
                                            Format: username/model-name (ex: darkc0de/Xortron)
                                        </p>
                                    </div>

                                    <div>
                                        <label className="block text-sm font-medium text-gray-200 mb-2">
                                            Max Tokens (Răspuns)
                                        </label>
                                        <input
                                            type="number"
                                            value={maxTokens}
                                            onChange={(e) => setMaxTokens(parseInt(e.target.value) || 4096)}
                                            min="1"
                                            max="4096"
                                            className="w-full px-4 py-2 bg-slate-600 border border-slate-500 rounded-lg text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-purple-500"
                                        />
                                        <p className="text-xs text-gray-400 mt-2">
                                            Limita maximă pentru acest model: 4096 tokens
                                        </p>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* Chat Messages */}
                        <div className="h-96 overflow-y-auto p-4 space-y-4 bg-slate-800">
                            {messages.length === 0 && (
                                <div className="text-center text-gray-400 mt-20">
                                    <MessageSquare size={48} className="mx-auto mb-4 opacity-50" />
                                    <p className="text-lg mb-2">Începe o conversație cu {modelName}</p>
                                    <p className="text-sm">
                                        {apiKey ? 'Scrie un mesaj mai jos pentru a începe...' : 'Introdu token-ul HF în setări pentru a începe'}
                                    </p>
                                </div>
                            )}
                            {messages.map((msg, idx) => (
                                <div
                                    key={idx}
                                    className={`flex ${msg.role === 'user' ? 'justify-end' : 'justify-start'}`}
                                >
                                    <div
                                        className={`max-w-3/4 px-4 py-3 rounded-2xl ${
                                            msg.role === 'user'
                                                ? 'bg-gradient-to-r from-purple-600 to-blue-600 text-white'
                                                : 'bg-slate-700 text-gray-100'
                                        }`}
                                    >
                                        <p className="whitespace-pre-wrap">{msg.content}</p>
                                    </div>
                                </div>
                            ))}
                            {loading && (
                                <div className="flex justify-start">
                                    <div className="bg-slate-700 text-gray-100 px-4 py-3 rounded-2xl">
                                        <div className="flex gap-2">
                                            <div className="w-2 h-2 bg-purple-500 rounded-full animate-bounce"></div>
                                            <div className="w-2 h-2 bg-purple-500 rounded-full animate-bounce" style={{ animationDelay: '0.1s' }}></div>
                                            <div className="w-2 h-2 bg-purple-500 rounded-full animate-bounce" style={{ animationDelay: '0.2s' }}></div>
                                        </div>
                                    </div>
                                </div>
                            )}
                        </div>

                        {/* Input Area */}
                        <div className="bg-slate-700 p-4 border-t border-slate-600">
                            <div className="flex gap-2">
                                <textarea
                                    value={input}
                                    onChange={(e) => setInput(e.target.value)}
                                    onKeyPress={handleKeyPress}
                                    placeholder={apiKey ? "Scrie un mesaj..." : "Setează API token-ul mai întâi..."}
                                    disabled={!apiKey || loading}
                                    className="flex-1 px-4 py-3 bg-slate-600 border border-slate-500 rounded-lg text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-purple-500 resize-none"
                                    rows="2"
                                />
                                <button
                                    onClick={sendMessage}
                                    disabled={!input.trim() || !apiKey || loading}
                                    className="px-6 py-3 bg-gradient-to-r from-purple-600 to-blue-600 text-white rounded-lg hover:from-purple-700 hover:to-blue-700 disabled:opacity-50 disabled:cursor-not-allowed transition-all"
                                >
                                    <Send size={20} />
                                </button>
                            </div>
                            <p className="text-xs text-gray-400 mt-2 text-center">
                                Apasă Enter pentru a trimite • Shift+Enter pentru linie nouă
                            </p>
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<HuggingFaceChat />);
    </script>
</body>
</html>
